<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- brand mark — top-left area -->
  <rect x="80" y="160" width="96" height="96" rx="20" fill="url(#mark)" />
  <text x="128" y="220" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-weight="700" font-size="54" fill="white">K</text>

  <!-- wordmark -->
  <text x="80" y="330" font-family="system-ui,-apple-system,sans-serif" font-weight="700" font-size="72" fill="white">Scritur</text>

  <!-- tagline -->
  <text x="80" y="390" font-family="system-ui,-apple-system,sans-serif" font-weight="400" font-size="28" fill="#a5b4fc">Learn. Understand. Remember.</text>

  <!-- subtitle -->
  <text x="80" y="440" font-family="system-ui,-apple-system,sans-serif" font-weight="400" font-size="22" fill="#c7d2fe">AI study app for videos, PDFs, and more.</text>

  <!-- decorative gradient bar -->
  <rect x="80" y="470" width="260" height="4" rx="2" fill="url(#mark)" />
</svg>
